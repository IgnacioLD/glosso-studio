stages:
  - build
  - release

variables:
  PACKAGE_REGISTRY_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/glosso-studio/${CI_COMMIT_TAG}"

# Tag builds publish only the APK. The model, vocab and sentence DBs are not rebuilt here:
# the app downloads them from the package pinned by `dataVersion` in AppModule.kt.
build_job:
  stage: build
  image: eclipse-temurin:17-jdk
  before_script:
    - export GRADLE_USER_HOME=$(pwd)/.gradle
    - chmod +x gradlew
    - if [ -n "$SIGNING_KEY_BASE64" ]; then echo "$SIGNING_KEY_BASE64" | base64 -d > release.keystore; export SIGNING_STORE_FILE=release.keystore; fi
  script:
    - ./gradlew :androidApp:assembleFdroidRelease
  artifacts:
    paths:
      - androidApp/build/outputs/apk/fdroid/release/*.apk
    expire_in: 1 week
  only:
    - tags

release_job:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - build_job
  only:
    - tags
  before_script:
    - apk add --no-cache curl
  script:
    - APK_FILE=$(ls androidApp/build/outputs/apk/fdroid/release/*.apk | head -n 1)
    - curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "${APK_FILE}" "${PACKAGE_REGISTRY_URL}/glosso-studio-${CI_COMMIT_TAG}.apk"
  release:
    name: 'Release ${CI_COMMIT_TAG}'
    description: 'Release created from tag ${CI_COMMIT_TAG}'
    tag_name: '${CI_COMMIT_TAG}'
    assets:
      links:
        - name: 'glosso-studio-${CI_COMMIT_TAG}.apk'
          url: '${PACKAGE_REGISTRY_URL}/glosso-studio-${CI_COMMIT_TAG}.apk'
          link_type: 'package'
